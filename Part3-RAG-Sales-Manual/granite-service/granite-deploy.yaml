apiVersion: apps/v1
kind: Deployment
metadata:
  name: granite-service
  labels:
    app: granite-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: granite-service
  template:
    metadata:
      labels:
        app: granite-service
    spec:
      # Node selector removed - not all Power10 nodes have MMA label set
      # MMA is available on Power10, but label may not be configured
      containers:
        - name: granite-llama
          image: image-registry.openshift-image-registry.svc:5000/rag-demo/granite-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 30
            timeoutSeconds: 5
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 45
            timeoutSeconds: 5
            periodSeconds: 20
            successThreshold: 1
            failureThreshold: 3
          resources:
            requests:
              memory: "8Gi"
              cpu: "2"
            limits:
              memory: "12Gi"
              cpu: "4"

