apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: vllm-service
  labels:
    app: vllm-service
spec:
  to:
    kind: Service
    name: vllm-service
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None

