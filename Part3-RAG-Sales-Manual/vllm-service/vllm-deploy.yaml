apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-service
  labels:
    app: vllm-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-service
  template:
    metadata:
      labels:
        app: vllm-service
    spec:
      containers:
        - name: vllm
          # Pre-built IBM ppc64le vLLM image from IBM Container Registry (unauthenticated access)
          # Source: https://github.com/IBM/project-ai-services/tree/main/ai-services/assets/components/llm/vllm-cpu
          image: icr.io/ppc64le-oss/vllm-ppc64le:0.19.1
          imagePullPolicy: IfNotPresent
          args:
            # Pass the HuggingFace model ID directly - vLLM downloads and caches it automatically.
            # Do NOT pass a local path like /models/... unless the model files already exist there.
            - --model
            - ibm-granite/granite-3.3-2b-instruct
            - --served-model-name
            - granite
            - --port=8000
            - --max-num-batched-tokens=8192
            - --max-model-len=8192
            - --dtype=float32
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          env:
            - name: VLLM_CPU_OMP_THREADS_BIND
              value: "auto"
            - name: VLLM_CPU_KVCACHE_SPACE
              value: "8"
            # HuggingFace cache — model downloaded here on first start (~2-5 GB)
            - name: HF_HOME
              value: "/hf-cache"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
              scheme: HTTP
            # Model download + load can take several minutes on first start
            initialDelaySeconds: 180
            timeoutSeconds: 10
            periodSeconds: 20
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 240
            timeoutSeconds: 10
            periodSeconds: 30
            failureThreshold: 6
          resources:
            requests:
              memory: "16Gi"
              cpu: "4"
            limits:
              memory: "24Gi"
              cpu: "8"
          volumeMounts:
            - name: hf-cache
              mountPath: /hf-cache
      volumes:
        # emptyDir persists for pod lifetime — model survives container restarts within the same pod
        - name: hf-cache
          emptyDir: {}

