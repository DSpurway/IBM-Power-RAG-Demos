apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensearch-service
  labels:
    app: opensearch-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opensearch-service
  template:
    metadata:
      labels:
        app: opensearch-service
    spec:
      containers:
      - name: opensearch
        # IBM Power-optimized OpenSearch from IBM Container Registry (unauthenticated access)
        # Source: https://community.ibm.com/community/user/blogs/priya-seth/2023/04/05/open-source-containers-for-power-in-icr
        # Using ppc64le-oss namespace which has unauthenticated access
        image: icr.io/ppc64le-oss/opensearch-ppc64le:3.3.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9200
          name: http
        - containerPort: 9300
          name: transport
        env:
        - name: discovery.type
          value: "single-node"
        - name: OPENSEARCH_JAVA_OPTS
          value: "-Xms2g -Xmx2g"
        - name: DISABLE_SECURITY_PLUGIN
          value: "true"
        - name: DISABLE_INSTALL_DEMO_CONFIG
          value: "true"
        resources:
          requests:
            memory: "4Gi"
            cpu: "2"
          limits:
            memory: "4Gi"
            cpu: "2"
        volumeMounts:
        - name: opensearch-data
          mountPath: /usr/share/opensearch/data
      volumes:
      - name: opensearch-data
        emptyDir: {}

