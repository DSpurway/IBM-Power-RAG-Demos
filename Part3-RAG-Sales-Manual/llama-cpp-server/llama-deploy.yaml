apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-service
  labels:
    app: llama-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llama-service
  template:
    metadata:
      labels:
        app: llama-service
    spec:
      containers:
        - name: llama-cpp
          image: image-registry.openshift-image-registry.svc:5000/rag-demo/llama-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 30
            timeoutSeconds: 5
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 45
            timeoutSeconds: 5
            periodSeconds: 20
            successThreshold: 1
            failureThreshold: 3
          resources:
            requests:
              memory: "4Gi"
              cpu: "2"
            limits:
              memory: "8Gi"
              cpu: "4"

