apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-backend
  labels:
    app: rag-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-backend
  template:
    metadata:
      labels:
        app: rag-backend
        deployment: rag-backend
    spec:
      containers:
        - name: rag-backend
          image: image-registry.openshift-image-registry.svc:5000/rag-demo/rag-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            # Watson Assistant Configuration — optional, pod starts without it
            - name: WATSON_ASSISTANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: watson-assistant-credentials
                  key: api-key
                  optional: true
            - name: WATSON_ASSISTANT_URL
              valueFrom:
                secretKeyRef:
                  name: watson-assistant-credentials
                  key: url
                  optional: true
            - name: WATSON_ASSISTANT_ID
              valueFrom:
                secretKeyRef:
                  name: watson-assistant-credentials
                  key: assistant-id
                  optional: true
            # OpenSearch Configuration
            - name: OPENSEARCH_HOST
              value: "opensearch-service"
            - name: OPENSEARCH_PORT
              value: "9200"
            - name: OPENSEARCH_USERNAME
              value: "admin"
            - name: OPENSEARCH_PASSWORD
              value: "admin"
            # Granite Service — llama.cpp (Part 3 baseline)
            - name: GRANITE_HOST
              value: "granite-service"
            - name: GRANITE_PORT
              value: "8080"
            # TinyLlama Service — llama.cpp (Part 1 & 2)
            - name: TINYLLAMA_HOST
              value: "llama-service"
            - name: TINYLLAMA_PORT
              value: "8080"
            # vLLM Service — OpenAI-compatible (performance comparison)
            - name: VLLM_HOST
              value: "vllm-service"
            - name: VLLM_PORT
              value: "8000"
            # Legacy support
            - name: LLAMA_HOST
              value: "granite-service"
            - name: LLAMA_PORT
              value: "8080"
            - name: SCRAPER_URL
              value: "https://ibm-docs-scraper-enhanced.29bw00k1vhg4.eu-gb.codeengine.appdomain.cloud"
            - name: PDF_DIR
              value: "/app/pdfs"
            - name: CORS_ORIGIN
              value: "*"
          volumeMounts:
            - name: pdf-storage
              mountPath: /app/pdfs
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 10
            timeoutSeconds: 5
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 15
            timeoutSeconds: 5
            periodSeconds: 20
            successThreshold: 1
            failureThreshold: 3
          resources:
            requests:
              memory: "2Gi"
              cpu: "1"
            limits:
              memory: "4Gi"
              cpu: "2"
      volumes:
        - name: pdf-storage
          emptyDir: {}

