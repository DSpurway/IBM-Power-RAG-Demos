# Podman Compose for IBM Power Sales Manual RAG Demo
# Runs on RHEL on IBM Power (ppc64le) — alternative to OpenShift deployment.
#
# Usage:
#   podman-compose up -d           # start all services
#   podman-compose down            # stop all services
#   podman-compose logs -f <svc>   # tail a service's logs
#
# Prerequisites on the RHEL LPAR:
#   sudo dnf install -y podman podman-compose
#
# Environment:
#   Copy env.example to .env and fill in values before starting.

version: "3.8"

networks:
  rag-net:
    driver: bridge

volumes:
  opensearch-data:
  model-cache:

services:

  # ── OpenSearch (IBM ppc64le image, unauthenticated) ──────────────────────────
  opensearch:
    image: icr.io/ppc64le-oss/opensearch-ppc64le:3.3.0
    container_name: opensearch-service
    environment:
      - discovery.type=single-node
      - OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    networks:
      - rag-net
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\\|yellow\"'"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    restart: unless-stopped

  # ── vLLM (IBM project-ai-services ppc64le CPU image) ─────────────────────────
  # Source: https://github.com/IBM/project-ai-services/tree/main/ai-services/assets/components/llm/vllm-cpu
  # Exposes an OpenAI-compatible API on port 8000.
  # Model is downloaded to the shared model-cache volume on first start.
  vllm:
    image: ${VLLM_IMAGE:-ghcr.io/ibm/project-ai-services/vllm-cpu:latest}
    container_name: vllm-service
    environment:
      - MODEL_ID=${MODEL_ID:-ibm-granite/granite-3.3-8b-instruct}
      - VLLM_HOST=0.0.0.0
      - VLLM_PORT=8000
      # CPU-only — no GPU flags needed on ppc64le LPAR
      - VLLM_WORKER_USE_RAY=0
      - HF_HOME=/models
    ports:
      - "8000:8000"
    volumes:
      - model-cache:/models
    networks:
      - rag-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 60s
      timeout: 15s
      start_period: 300s   # model download can take several minutes
      retries: 5
    restart: unless-stopped

  # ── RAG Backend ───────────────────────────────────────────────────────────────
  # Built from source in the rag-backend/ sibling directory.
  rag-backend:
    image: ${RAG_BACKEND_IMAGE:-localhost/rag-backend:latest}
    container_name: rag-backend
    build:
      context: ../rag-backend
      dockerfile: Dockerfile
    environment:
      # OpenSearch
      - OPENSEARCH_HOST=opensearch-service
      - OPENSEARCH_PORT=9200
      - OPENSEARCH_USERNAME=admin
      - OPENSEARCH_PASSWORD=admin
      - OPENSEARCH_DB_PREFIX=rag
      # vLLM replaces llama.cpp — same OpenAI-compatible API, different port
      - GRANITE_HOST=vllm-service
      - GRANITE_PORT=8000
      - LLAMA_HOST=vllm-service
      - LLAMA_PORT=8000
      # Watson Assistant (optional — leave empty to disable)
      - WATSON_ASSISTANT_API_KEY=${WATSON_ASSISTANT_API_KEY:-}
      - WATSON_ASSISTANT_URL=${WATSON_ASSISTANT_URL:-}
      - WATSON_ASSISTANT_ID=${WATSON_ASSISTANT_ID:-}
      # Misc
      - CORS_ORIGIN=*
      - PDF_DIR=/app/pdfs
    ports:
      - "8080:8080"
    networks:
      - rag-net
    depends_on:
      opensearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped

  # ── Carbon RAG UI ─────────────────────────────────────────────────────────────
  # Built from source in the carbon-rag-ui/ sibling directory.
  carbon-ui:
    image: ${CARBON_UI_IMAGE:-localhost/carbon-rag-ui:latest}
    container_name: carbon-rag-ui
    build:
      context: ../carbon-rag-ui
      dockerfile: Dockerfile
    environment:
      # Internal service name — resolved within the Podman network
      - RAG_BACKEND_URL=http://rag-backend:8080
      - NODE_ENV=production
      - PORT=3000
    ports:
      - "3000:3000"
    networks:
      - rag-net
    depends_on:
      rag-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    restart: unless-stopped

